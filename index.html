<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round Robin Land | Media Pembelajaran Sistem Operasi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gantt.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar: peta level -->
    <aside class="sidebar">
      <div class="brand">
        <span class="roda" aria-hidden="true">🎡</span>
        <div>
          <b>Round Robin Land</b>
          <small>Sistem Operasi</small>
        </div>
      </div>

      <div class="xp">
        <div class="xp-baris"><span>Progres</span><span id="xpLabel">0 / 3 level</span></div>
        <div class="xp-bar"><div class="xp-isi" id="xpBar"></div></div>
      </div>

      <div class="peta-judul">Peta belajar</div>
      <nav class="peta" role="tablist" aria-label="Peta level">
        <button class="tab aktif" role="tab" aria-selected="true" data-target="teori">
          <span class="node">1</span>
          <span class="teks"><b>📖 Teori</b><small>Level 1</small></span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-target="simulasi">
          <span class="node">2</span>
          <span class="teks"><b>🎮 Simulasi</b><small>Level 2</small></span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-target="kuis">
          <span class="node">3</span>
          <span class="teks"><b>🧩 Kuis</b><small>Level 3</small></span>
        </button>
      </nav>

      <div class="sidebar-foot">Dibuat oleh Kelompok 6</div>
    </aside>

    <!-- Konten -->
    <div class="konten">
      <div class="judul-mobile">🎡 Round Robin Land</div>

    <main>
        <section id="teori" class="panel aktif"></section>
        <section id="simulasi" class="panel"></section>
        <section id="kuis" class="panel"></section>
      </main>

      <footer>Mata kuliah Sistem Operasi · Penjadwalan CPU Round Robin</footer>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
